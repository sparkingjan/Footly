<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats — Footly</title><link rel="stylesheet" href="style.css"><style>.portal{background:#f3f7f1;color:var(--ink);min-height:100vh}.portal-header{position:sticky;top:0;z-index:3;background:var(--ink);height:74px;padding:0 max(20px,5%)}.portal-main{max-width:1100px;margin:auto;padding:54px max(20px,5%) 110px}.portal-main h1{font:600 clamp(46px,8vw,90px)/.85 'Space Grotesk';letter-spacing:-.09em;margin:10px 0}.portal-main h1 em{color:#719541;font-style:normal}.portal-copy{color:#6f8878;font-size:13px}..portal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0 18px}.portal-card{background:#fff;border:1px solid #dfe8df;border-radius:14px;padding:22px;box-shadow:0 7px 25px #173d2410}.portal-stat b{display:block;font:600 42px 'Space Grotesk';color:#719541}.portal-stat span{font:10px 'DM Mono';color:#71877a;text-transform:uppercase}.portal-card h2{font:600 19px 'Space Grotesk';margin:0 0 17px}.event-list div{display:flex;justify-content:space-between;border-top:1px solid #e1e9e1;padding:13px 0;font-size:12px}.event-list small{color:#71877a;font:10px 'DM Mono'}.muted{color:#83968a;font-size:13px}.portal-nav{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:50px;background:var(--ink);padding:14px}.portal-nav a{color:#87a091;text-decoration:none;font:10px 'DM Mono'}.portal-nav a:hover{color:var(--lime)}@media(max-width:700px){.portal-grid{grid-template-columns:1fr 1fr}.portal-nav{gap:18px;justify-content:space-around}}
</style><link rel="stylesheet" href="redesign.css"></head><body class="portal" data-portal="stats"><header class="site-header portal-header"><a class="logo" href="index.html"><span>F</span>Footly</a><a class="header-link" href="app.html">Dashboard</a></header><main class="portal-main"><span class="app-kicker">Current match record</span><h1>Player <em>stats.</em></h1><p class="portal-copy">Goals, assists, and events from your current match.</p><div class="portal-grid"><section class="portal-card portal-stat"><b id="matches">0</b><span>Matches</span></section><section class="portal-card portal-stat"><b id="goals">0</b><span>Goals</span></section><section class="portal-card portal-stat"><b id="assists">0</b><span>Assists</span></section></div><section class="portal-card"><h2>Current record</h2><p id="team" class="portal-copy">No home team</p><p id="match-summary" class="portal-copy">No match played yet</p><div id="event-list" class="event-list"></div></section></main><nav class="portal-nav"></nav><script type="module" src="./portal-pages.js"></script><script src="workspace-ui.js"></script></body></html>
