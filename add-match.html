<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match setup — Footly</title><link rel="stylesheet" href="style.css"><style>.match-page{background:#f3f7f1;color:var(--ink);min-height:100vh}.match-header{position:sticky;top:0;z-index:3;background:var(--ink);height:74px;padding:0 max(20px,5%)}.match-main{max-width:820px;margin:auto;padding:54px max(20px,5%) 110px}.match-main h1{font:600 clamp(46px,8vw,90px)/.85 'Space Grotesk';letter-spacing:-.09em;margin:10px 0}.match-main h1 em{color:#719541;font-style:normal}.match-copy{color:#6f8878;font-size:13px;margin-bottom:30px}.match-form{display:grid;gap:16px;background:#fff;border:1px solid #dfe8df;border-radius:14px;padding:25px;box-shadow:0 7px 25px #173d2410}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.match-form label{display:grid;gap:7px;color:#789080;font:9px 'DM Mono';letter-spacing:.1em;text-transform:uppercase}.match-form input,.match-form select{border:1px solid #d6e1d7;border-radius:8px;padding:13px;background:#fbfdf9;color:var(--ink);font:13px 'DM Sans'}.match-form button{border:0;border-radius:8px;background:#719541;color:#fff;padding:14px;font-weight:700;cursor:pointer}.match-message{min-height:16px;color:#719541;font:10px 'DM Mono';line-height:1.5}.match-steps{display:flex;gap:9px;margin:25px 0;color:#789080;font:10px 'DM Mono'}.match-steps span{padding:8px 10px;border-radius:6px;background:#e8f0e7}.match-steps span.active{background:#dff0c5;color:#476b2e}@media(max-width:650px){.match-grid{grid-template-columns:1fr}}
</style></head><body class="match-page"><header class="site-header match-header"><a class="logo" href="index.html"><span>F</span>Footly</a><a class="header-link" href="app.html">Back to app</a></header><main class="match-main"><span class="app-kicker">Match setup</span><h1>Create a<br><em>live match.</em></h1><p class="match-copy">Choose the teams you built, add the fixture details, and open the scorekeeper.</p><div class="match-steps"><a href="team-setup.html">01 Home team</a><a href="away-team.html">02 Away team</a><span class="active">03 Match</span></div><form class="match-form" id="match-form"><div class="match-grid"><label>Home team<select id="match-home" required></select></label><label>Away team<select id="match-away" required></select></label><label>Competition<input id="competition" maxlength="100" required value="Local League"></label><label>Venue<input id="venue" maxlength="200" required placeholder="Pitch or stadium"></label><label>Format<select id="format"></select></label><label>Match type<select id="match-type"><option>Friendly</option><option>League</option><option>Knockout</option></select></label></div><label>Date and time<input id="match-date" type="datetime-local" required></label><button type="submit">Start live match →</button><div class="match-message" id="match-message"></div></form></main><script type="module" src="./match-builder.js"></script><script src="./back-nav.js"></script></body></html>
