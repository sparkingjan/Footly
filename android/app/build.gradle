plugins { id 'com.android.application' }
android {
 namespace 'app.footly.android'
 compileSdk 36
 defaultConfig { applicationId 'app.footly.android'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0.0' }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.includeAndroidResources = true }
 buildTypes { release { minifyEnabled false } }
}
dependencies {
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 implementation platform('com.google.firebase:firebase-bom:34.3.0')
 implementation 'com.google.firebase:firebase-auth'
 implementation 'com.google.firebase:firebase-firestore'
 implementation 'androidx.work:work-runtime:2.10.5'
 implementation 'com.google.guava:guava:33.4.8-android'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
