plugins { id 'com.android.application' }
def signingPropertiesFile = rootProject.file('.signing/release.properties')
def releaseKeys = new Properties()
if (signingPropertiesFile.isFile()) {
 signingPropertiesFile.withInputStream { releaseKeys.load(it) }
}
tasks.register('checkReleaseSigning') {
 doLast {
  if (!signingPropertiesFile.isFile()) throw new GradleException('Release signing is missing. Restore android/.signing from your private backup.')
 }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseSigning' }

android {
 namespace 'app.footly.android'
 compileSdk 36
 defaultConfig { applicationId 'app.footly.android'; minSdk 26; targetSdk 36; versionCode 3; versionName '1.1.0' }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.includeAndroidResources = true }
 signingConfigs {
 release {
  if (signingPropertiesFile.isFile()) {
   storeFile rootProject.file(releaseKeys.getProperty('storeFile'))
   storePassword releaseKeys.getProperty('storePassword')
   keyAlias releaseKeys.getProperty('keyAlias')
   keyPassword releaseKeys.getProperty('keyPassword')
  }
 }
}
buildTypes { release { debuggable false; minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies {
 implementation 'androidx.activity:activity:1.10.1'
 implementation 'androidx.webkit:webkit:1.14.0'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 implementation platform('com.google.firebase:firebase-bom:34.3.0')
 implementation 'com.google.firebase:firebase-auth'
 implementation 'com.google.firebase:firebase-firestore'
 implementation 'androidx.work:work-runtime:2.10.5'
 implementation 'com.google.guava:guava:33.4.8-android'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
