<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071c13" />
  <title>Match details — Footly</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .details-page .site-header { position: relative; }
    .details-main { max-width: 1240px; margin: 0 auto; padding: 54px 5% 110px; }
    .details-back { color: #9eafa4; font: 10px 'DM Mono'; text-decoration: none; letter-spacing: .1em; }
    .details-back b { color: var(--lime); margin-right: 8px; }
    .details-hero { margin: 36px 0 18px; border: 1px solid #ffffff2b; border-radius: 10px; overflow: hidden; background: #0d2a1e; }
    .details-kicker { display: flex; justify-content: space-between; align-items: center; padding: 17px 24px; border-bottom: 1px solid #ffffff1c; font: 10px 'DM Mono'; color: #8ea296; letter-spacing: .1em; }
    .details-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; padding: 45px 8%; }
    .details-team { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .details-team strong { font: 600 22px/1.05 'Space Grotesk'; letter-spacing: -.05em; }
    .details-team small, .details-scoreline small { color: #839b8e; font: 9px 'DM Mono'; letter-spacing: .12em; }
    .details-scoreline { display: flex; align-items: center; gap: 18px; padding: 0 35px; }
    .details-scoreline b { font: 600 78px/1 'Space Grotesk'; letter-spacing: -.12em; }
    .details-scoreline span { color: #688375; font-size: 28px; }
    .details-scoreline small { position: absolute; margin-top: 112px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
    .details-subnav { display: flex; gap: 25px; padding: 0 24px; border-top: 1px solid #ffffff1c; }
    .details-subnav a { color: #8ea296; padding: 17px 0 14px; font: 10px 'DM Mono'; text-decoration: none; letter-spacing: .08em; }
    .details-subnav a:first-child { color: var(--lime); border-bottom: 2px solid var(--lime); }
    .details-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .details-panel { background: #0d2a1e; border: 1px solid #ffffff24; border-radius: 10px; padding: 24px; }
    .details-panel h2 { font: 600 20px 'Space Grotesk'; letter-spacing: -.05em; margin: 0 0 21px; }
    .panel-label { color: #80968a; font: 9px 'DM Mono'; letter-spacing: .12em; text-transform: uppercase; }
    .commentary-row { display: grid; grid-template-columns: 45px 28px 1fr; gap: 10px; align-items: start; padding: 14px 0; border-top: 1px solid #ffffff1c; color: #dce7dd; font-size: 12px; }
    .commentary-row time { color: #88a092; font: 10px 'DM Mono'; }
    .commentary-row .event-icon { padding-top: 2px; }
    .commentary-row small { display: block; color: #789083; font-size: 10px; margin-top: 5px; }
    .stat-row { display: grid; grid-template-columns: 1fr 55px 1fr; align-items: center; margin: 18px 0; font: 12px 'Space Grotesk'; }
    .stat-row strong:first-child { text-align: left; color: var(--lime); }.stat-row strong:nth-child(3) { text-align: right; color: #dce7dd; }.stat-row span { text-align: center; color: #8ba095; font: 9px 'DM Mono'; text-transform: uppercase; }
    .stat-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: -9px 0 22px; }.stat-bars i { display: block; height: 4px; border-radius: 5px; background: var(--lime); }.stat-bars i:last-child { background: #547563; }
    .lineup { border-top: 1px solid #ffffff1c; padding: 14px 0; }.lineup:first-of-type { border-top: 0; padding-top: 0; }.lineup h3 { display: flex; justify-content: space-between; margin: 0 0 12px; font: 600 14px 'Space Grotesk'; }.lineup h3 span { color: #8da296; font: 9px 'DM Mono'; }
    .player-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }.player { display: flex; align-items: center; gap: 9px; color: #cbdace; font-size: 11px; }.player-number { color: var(--lime); font: 10px 'DM Mono'; width: 18px; }.player small { color: #789083; margin-left: auto; font: 9px 'DM Mono'; }
    .player-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }.player-card { padding: 13px; border: 1px solid #ffffff1c; border-radius: 7px; }.player-card b { display: block; color: #ecf4ec; font: 600 14px 'Space Grotesk'; }.player-card span { display: block; color: #80978b; font: 9px 'DM Mono'; margin-top: 4px; }.player-card strong { display: block; color: var(--lime); font: 600 22px 'Space Grotesk'; margin-top: 14px; }
    @media(max-width:700px){ .details-main{padding:38px 20px 80px}.details-kicker{padding:15px}.details-kicker .competition{display:none}.details-score{padding:35px 8px}.details-team strong{font-size:16px}.details-scoreline{gap:8px;padding:0 8px}.details-scoreline b{font-size:52px}.details-subnav{gap:15px;padding:0 15px;overflow:auto}.details-subnav a{white-space:nowrap}.details-grid{grid-template-columns:1fr}.details-panel{padding:18px}.player-list{gap:8px}.player-cards{grid-template-columns:1fr 1fr} }
    .lineup-panel{grid-column:1/-1;padding:24px!important}.lineup-panel h2{margin-bottom:8px}.lineup-tabs{display:flex;border-bottom:1px solid #ffffff24;margin:0 -24px 24px;padding:0 24px}.lineup-tab{background:none;border:0;border-bottom:2px solid transparent;color:#879b8f;cursor:pointer;font:600 13px 'Space Grotesk';padding:14px 50px}.lineup-tab.active{border-color:var(--lime);color:var(--lime)}.pitch{position:relative;max-width:860px;height:560px;margin:0 auto;border:2px solid #bce887;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(90deg,#3d8729 0,#3d8729 12.5%,#438e2d 12.5%,#438e2d 25%)}.pitch:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.8%,#d4f1a3 50%,transparent 50.2%),radial-gradient(circle at 50% 50%,transparent 0 46px,#d4f1a3 47px 49px,transparent 50px)}.pitch:after{content:'';position:absolute;left:50%;top:50%;width:120px;height:120px;border:2px solid #d4f1a3;transform:translate(-50%,-50%);border-radius:50%;opacity:.8}.pitch-mark{position:absolute;z-index:1;border:2px solid #d4f1a3;left:50%;transform:translateX(-50%);width:260px;height:105px}.pitch-mark.top{top:-2px;border-top:0}.pitch-mark.bottom{bottom:-2px;border-bottom:0}.pitch-player{position:absolute;z-index:2;transform:translate(-50%,-50%);width:92px;text-align:center;color:#fff;font:700 10px 'DM Sans'}.pitch-avatar{display:grid;place-items:center;width:39px;height:39px;margin:0 auto 4px;border:2px solid #ecf8d3;border-radius:50%;background:#132d20;color:var(--lime);font:700 13px 'Space Grotesk';box-shadow:0 2px 8px #071c13aa}.pitch-player span:last-child{display:inline-block;background:#050a06;border-radius:6px;padding:5px 6px;white-space:nowrap}.pitch-player small{display:none}.formation-note{color:#7e9888;font:10px 'DM Mono';letter-spacing:.1em;margin-bottom:14px}.lineup-tip{color:#89a294;font-size:11px;margin:15px 0 0;text-align:center}@media(max-width:700px){.lineup-panel{padding:18px!important}.lineup-tabs{margin:0 -18px 18px;padding:0 18px}.lineup-tab{padding:13px 18px}.pitch{height:470px}.pitch-player{width:75px;font-size:8px}.pitch-avatar{width:32px;height:32px;font-size:10px}.pitch-player span:last-child{padding:4px}.pitch-mark{width:150px;height:76px}}
  </style>
  <style>
    .individual-stats{margin-top:28px;border-top:1px solid #ffffff1c;padding-top:22px}.individual-stats h3{font:600 16px 'Space Grotesk';margin:0 0 14px}.player-stat-head,.player-stat-row{display:grid;grid-template-columns:2fr repeat(7,1fr);gap:8px;align-items:center}.player-stat-head{color:#789083;font:9px 'DM Mono';letter-spacing:.08em;text-transform:uppercase;padding:0 12px 10px}.player-stat-row{border-top:1px solid #ffffff12;color:#dce7dd;font-size:11px;padding:11px 12px}.player-stat-row span:not(:first-child),.player-stat-head span:not(:first-child){text-align:center}.player-stat-row span:last-child{color:var(--lime);font-weight:700}.player-stat-name{font-family:'Space Grotesk';font-weight:600}.player-stat-name small{color:#789083;font:9px 'DM Mono';margin-left:7px}@media(max-width:700px){.individual-stats{overflow-x:auto}.player-stat-head,.player-stat-row{min-width:700px}}
  </style>

  <header class="site-header page-header">
    <a class="logo" href="index.html" aria-label="Footly home"><span>F</span>Footly</a>
    <nav class="desktop-nav"><a href="index.html#the-game">The game</a><a class="active-nav" href="live-matches.html">Live Matches</a><a href="index.html#community">Community</a><a href="index.html#features">Features</a></nav>
    <a class="header-link" href="live-matches.html">All matches <b>↗</b></a>
  </header>
  <main class="details-main">
    <a class="details-back" href="live-matches.html"><b>←</b> BACK TO LIVE MATCHES</a>
    <section class="details-hero"><div class="details-kicker">Loading match…</div><div class="details-score"></div><nav class="details-subnav"><a href="match-summary.html">Summary</a><a href="match-commentary.html">Commentary</a><a href="match-lineups.html">Lineups</a><a href="match-stats.html">Stats</a><a href="live-scorekeeper.html">Record events</a></nav></section><div class="details-grid"><section class="details-panel" id="commentary"></section><section class="details-panel" id="lineups"></section><section class="details-panel" id="stats"></section><section class="details-panel" id="summary"></section></div></main>

<script src="workspace-ui.js"></script></body>
</html>
