<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Footly</title><link rel="stylesheet" href="style.css">
  <style>
    .auth-page{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#16452d 0,#081d14 45%)}
    .auth-wrap{width:min(430px,calc(100% - 40px))}.auth-wrap .logo{margin-bottom:48px}
    .auth-card{background:#0d2a1e;border:1px solid #ffffff24;border-radius:14px;padding:28px}
    .auth-card h1{font:600 45px/.9 'Space Grotesk';letter-spacing:-.08em;margin:0 0 12px}.auth-card h1 em{color:var(--lime);font-style:normal}
    .auth-copy{color:#91a69a;font-size:13px;line-height:1.5;margin:0 0 26px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ffffff22;margin-bottom:23px}
    .auth-tabs button{border:0;background:none;color:#88a091;padding:12px 4px;cursor:pointer;font:11px 'DM Mono'}.auth-tabs button.active{color:var(--lime);border-bottom:2px solid var(--lime)}
    .auth-form{display:grid;gap:14px}.auth-form label{display:grid;gap:7px;color:#8ea296;font:9px 'DM Mono';letter-spacing:.12em;text-transform:uppercase}
    .auth-form input{background:#092218;border:1px solid #ffffff27;border-radius:6px;color:#f7faf4;padding:13px;font:13px 'DM Sans'}.auth-form button{border:0;border-radius:7px;background:var(--lime);color:var(--ink);padding:14px;font-weight:700;cursor:pointer}
    .auth-form button:disabled{opacity:.6;cursor:wait}.forgot-button{justify-self:end;border:0!important;background:none!important;color:#b9d779!important;padding:0!important;font:10px 'DM Mono';font-weight:400!important}
    .auth-message{color:var(--lime);font:10px 'DM Mono';line-height:1.5;min-height:16px}.auth-message.error{color:#ffb4a8}
  </style>
</head>
<body class="auth-page"><main class="auth-wrap"><a class="logo" href="index.html"><span>F</span>Footly</a>
  <section class="auth-card"><h1>Welcome<br><em>back.</em></h1><p class="auth-copy">Sign in to manage your local teams, matches, and live scorecards.</p>
    <div class="auth-tabs"><button class="active" data-mode="signin">Sign in</button><button data-mode="signup">Create account</button></div>
    <form class="auth-form" id="auth-form"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
      <label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="6+ characters"></label>
      <button class="forgot-button" id="forgot" type="button">Forgot password?</button><button id="submit" type="submit">Sign in to Footly</button><div class="auth-message" id="message"></div>
    </form>
  </section>
</main>
<script type="module">
import { auth, db, firebaseConfigured, doc, setDoc, serverTimestamp } from './firebase-client.js';
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const form=document.getElementById('auth-form'), email=document.getElementById('email'), password=document.getElementById('password'), message=document.getElementById('message'), submit=document.getElementById('submit'), forgot=document.getElementById('forgot');
let mode=new URLSearchParams(location.search).get('mode')==='signup'?'signup':'signin';
const errorText=error=>({ 'auth/invalid-credential':'Email or password is incorrect.', 'auth/email-already-in-use':'An account already exists for this email.', 'auth/weak-password':'Password must be at least 6 characters.', 'auth/invalid-email':'Enter a valid email address.', 'auth/too-many-requests':'Too many attempts. Try again later.'}[error.code]||'Authentication failed. Please try again.');
function setMessage(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(tab=>tab.classList.toggle('active',tab.dataset.mode===mode));submit.textContent=mode==='signin'?'Sign in to Footly':'Create my account';forgot.hidden=mode!=='signin';setMessage('')}
document.querySelectorAll('[data-mode]').forEach(tab=>tab.addEventListener('click',()=>setMode(tab.dataset.mode)));setMode(mode);
form.addEventListener('submit',async event=>{event.preventDefault();if(!firebaseConfigured){setMessage('Firebase Web App config is missing. Add it in firebase-config.js.',true);return}submit.disabled=true;setMessage('Please wait…');try{const result=mode==='signin'?await signInWithEmailAndPassword(auth,email.value.trim(),password.value):await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);const displayName=result.user.displayName||email.value.split('@')[0];if(mode==='signup')await updateProfile(result.user,{displayName});await setDoc(doc(db,'users',result.user.uid),{email:result.user.email,displayName,updatedAt:serverTimestamp()},{merge:true});location.href='app.html'}catch(error){setMessage(errorText(error),true);submit.disabled=false}});
forgot.addEventListener('click',async()=>{if(!email.value.trim()){setMessage('Enter your email first.',true);email.focus();return}if(!firebaseConfigured){setMessage('Firebase Web App config is missing.',true);return}forgot.disabled=true;try{await sendPasswordResetEmail(auth,email.value.trim());setMessage('Password reset email sent.')}catch(error){setMessage(errorText(error),true)}finally{forgot.disabled=false}});
</script>
</body></html>
<script src="./back-nav.js"></script>
