<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Away team — Footly</title><link rel="stylesheet" href="style.css"><style>
.builder-page{background:#f3f7f1;color:var(--ink);min-height:100vh}.builder-header{position:sticky;top:0;z-index:4;background:var(--ink);height:74px;padding:0 max(20px,5%)}.builder-main{max-width:1180px;margin:auto;padding:44px max(20px,5%) 100px}.builder-heading{margin:8px 0 25px}.builder-heading h1{font:600 clamp(44px,7vw,80px)/.88 'Space Grotesk';letter-spacing:-.09em;margin:8px 0}.builder-heading h1 em{color:#719541;font-style:normal}.builder-heading p{color:#6f8878;font-size:13px}.builder-form{display:grid;grid-template-columns:320px 1fr;gap:20px}.builder-card{background:#fff;border:1px solid #dfe8df;border-radius:14px;padding:24px;box-shadow:0 7px 25px #173d2410}.builder-fields{display:grid;align-content:start;gap:14px}.builder-fields label,.formation-tools label{display:grid;gap:7px;color:#789080;font:9px 'DM Mono';letter-spacing:.1em;text-transform:uppercase}.builder-fields input,.builder-fields select,.builder-fields textarea,.formation-tools select{border:1px solid #d6e1d7;border-radius:8px;padding:12px;background:#fbfdf9;color:var(--ink);font:13px 'DM Sans'}.builder-fields textarea{min-height:180px;resize:vertical}.builder-actions{display:flex;gap:9px;flex-wrap:wrap}.builder-actions button{border:0;border-radius:8px;background:#719541;color:#fff;padding:13px 16px;font-weight:700;cursor:pointer}.builder-actions .danger{background:#a3473d}.builder-message{min-height:18px;color:#719541;font:10px 'DM Mono';line-height:1.5}.formation-tools{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.formation-tools h2{font:600 19px 'Space Grotesk';margin:0}.formation-layout{display:grid;grid-template-columns:160px 1fr;gap:14px}.formation-layout.pool-empty{grid-template-columns:1fr}.player-pool{border:1px solid #dce6dd;border-radius:9px;padding:10px}.player-pool h3{font:10px 'DM Mono';color:#789080;margin:0 0 10px;text-transform:uppercase}.pool-player{display:block;width:100%;border:1px solid #dce6dd;border-radius:5px;background:#f8fbf6;color:#17351e;padding:7px;margin:5px 0;text-align:left;font:11px 'DM Sans';cursor:grab}.football-pitch{position:relative;min-height:560px;border:3px solid #d8f0cc;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(0deg,#347d31 0,#347d31 70px,#3b8736 70px,#3b8736 140px)}.football-pitch:before{content:'';position:absolute;inset:50% 0 auto;height:2px;background:#e8f7df}.football-pitch:after{content:'';position:absolute;width:120px;height:120px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #e8f7df;border-radius:50%}.pitch-box{position:absolute;left:50%;transform:translateX(-50%);width:42%;height:18%;border:2px solid #e8f7df}.pitch-box.top{top:0;border-top:0}.pitch-box.bottom{bottom:0;border-bottom:0}.pitch-player{position:absolute;transform:translate(-50%,-50%);z-index:2;width:110px;text-align:center;cursor:grab}.pitch-player select{max-width:110px;border:1px solid #f5ffe7;border-radius:5px;background:#e7f4d8;color:#17351e;padding:5px 2px;font:10px 'DM Sans'}.pitch-player small{display:block;color:#efffe9;font:9px 'DM Mono';margin-top:3px;text-shadow:0 1px 2px #173d24}.player-image{display:block;width:38px;height:38px;object-fit:contain;margin:0 auto -2px}.builder-back{color:#719541;text-decoration:none;font:10px 'DM Mono';letter-spacing:.08em}@media(max-width:800px){.builder-form{grid-template-columns:1fr}.formation-layout{grid-template-columns:1fr}.football-pitch{min-height:470px}}
</style><link rel="stylesheet" href="redesign.css"></head>
<body class="builder-page" data-team-side="away"><header class="site-header builder-header"><a class="logo" href="index.html"><span>F</span>Footly</a><a class="header-link" href="app.html">Back to app</a></header><main class="builder-main"><a class="builder-back" href="app.html">← Back to teams</a><div class="builder-heading"><span class="app-kicker">Away team setup</span><h1>Build your<br><em>away team.</em></h1><p>Create the opposing roster and place every player on the pitch.</p></div><form class="builder-form"><section class="builder-card builder-fields"><label>Team name<input id="team-name" maxlength="100" required placeholder="e.g. Riverpark FC"></label><label>Captain<select id="captain" required><option value="">Select captain</option></select></label><label>Players<textarea id="players" maxlength="5000" required placeholder="One player per line"></textarea></label><div class="builder-actions"><button type="submit">Save away team</button><button type="button" class="danger" id="delete-team">Delete team</button></div><div class="builder-message" id="builder-message"></div></section><section class="builder-card formation-card"><div class="formation-tools"><h2>Build your lineup</h2><label>Format<select id="team-format"></select></label></div><div class="formation-layout pool-empty"><div class="player-pool" id="player-pool"><h3>Drag players</h3></div><div class="football-pitch" id="football-pitch"><div class="pitch-box top"></div><div class="pitch-box bottom"></div></div></div><p class="builder-message">Drag players anywhere on the pitch. Roles update automatically, or choose a role manually.</p></section></form></main><script type="module" src="./team-editor.js"></script>  <script src="./mobile-touch.js"></script>
<script src="workspace-ui.js"></script></body></html>
